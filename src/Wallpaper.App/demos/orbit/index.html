<!doctype html><html><head><meta charset="utf-8"><title>轨道</title><style>html,body{margin:0;overflow:hidden;background:#0b1019}canvas{display:block}</style></head><body><canvas></canvas><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');function resize(){c.width=innerWidth;c.height=innerHeight}onresize=resize;resize();let frames=0;
function draw(t){window.animationFrames=++frames;const w=c.width,h=c.height,s=Math.min(w,h)*.3;x.fillStyle='#0b1019';x.fillRect(0,0,w,h);x.save();x.translate(w/2,h/2);x.rotate(-.35);for(let i=0;i<7;i++){const r=s*(.3+i*.15);x.strokeStyle=`rgba(110,165,222,${.1+i*.025})`;x.lineWidth=1;x.beginPath();x.ellipse(0,0,r,r*.48,0,0,Math.PI*2);x.stroke();const a=t/(10000+i*2200)+i;x.fillStyle=i%2?'#78d8c4':'#90b8ee';x.beginPath();x.arc(Math.cos(a)*r,Math.sin(a)*r*.48,3+i*.7,0,Math.PI*2);x.fill()}x.strokeStyle='#a3c5ef';x.lineWidth=2;x.beginPath();x.arc(0,0,12,0,Math.PI*2);x.stroke();x.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
