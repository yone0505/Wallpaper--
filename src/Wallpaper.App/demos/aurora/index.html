<!doctype html><html><head><meta charset="utf-8"><title>极光</title><style>html,body{margin:0;overflow:hidden;background:#08131c}canvas{display:block}</style></head><body><canvas></canvas><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');function resize(){c.width=innerWidth;c.height=innerHeight}onresize=resize;resize();let frames=0;
function draw(t){frames++;window.animationFrames=frames;const w=c.width,h=c.height;x.fillStyle='#08131c';x.fillRect(0,0,w,h);for(let j=0;j<5;j++){const g=x.createLinearGradient(0,h*.1,0,h*.85);g.addColorStop(0,'rgba(35,213,170,0)');g.addColorStop(.4,`rgba(${40+j*12},${150-j*8},${190+j*10},.16)`);g.addColorStop(1,'rgba(31,160,150,0)');x.fillStyle=g;x.beginPath();x.moveTo(0,h);for(let i=0;i<=w;i+=8){const y=h*(.38+.09*Math.sin(i/w*8+t/7000+j)+.04*Math.sin(i/w*18-t/5000+j));x.lineTo(i,y)}x.lineTo(w,h);x.closePath();x.fill()}for(let i=0;i<85;i++){const a=((i*7919)%1000)/1000,b=((i*3571)%1000)/1000;x.fillStyle=`rgba(214,234,255,${.25+.45*Math.sin(t/2800+i)**2})`;x.fillRect(a*w,b*h*.72,i%5===0?2:1,i%5===0?2:1)}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
