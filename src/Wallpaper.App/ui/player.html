<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}video{width:100%;height:100%;object-fit:cover}#error{position:absolute;inset:0;color:#eee;display:none;place-items:center;font:18px sans-serif;background:#222}</style></head><body><video id="video" autoplay loop muted playsinline></video><div id="error"></div><script>const video=document.querySelector('video');video.src=new URLSearchParams(location.search).get('src');video.addEventListener('error',()=>{const e=document.querySelector('#error');e.style.display='grid';e.textContent='无法播放此视频。请尝试 MP4（H.264）或 WebM。'});</script></body></html>
